name: Release artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to populate
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  release-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          metadata = tomllib.loads(Path("pyproject.toml").read_text())
          expected_tag = f"v{metadata['project']['version']}"
          if tag != expected_tag:
              raise SystemExit(f"release tag {tag!r} does not match {expected_tag!r}")
          PY
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        run: python -m twine check dist/*
      - name: Verify wheel installation
        run: |
          python -m venv /tmp/patchcreator-release-smoke
          /tmp/patchcreator-release-smoke/bin/python -m pip install dist/*.whl
          /tmp/patchcreator-release-smoke/bin/patchcreator --version
          /tmp/patchcreator-release-smoke/bin/patchcreator profiles list | grep -F brother-innovis-750e
      - name: Create checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
      - name: Attach artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" dist/* --clobber
