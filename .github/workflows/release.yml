name: Release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach (for example, v0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  python-distributions:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          expected_tag = f"v{version}"
          if tag != expected_tag:
              raise SystemExit(
                  f"release tag {tag!r} does not match package version {version!r} "
                  f"(expected {expected_tag!r})"
              )
          PY

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build source and wheel distributions
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/patchcreator-release-smoke
          /tmp/patchcreator-release-smoke/bin/python -m pip install dist/*.whl
          /tmp/patchcreator-release-smoke/bin/patchcreator --version

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS

      - name: Attach distributions to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
