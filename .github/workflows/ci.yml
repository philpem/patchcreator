name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: pytest
      - name: CLI smoke test
        run: patchcreator --help

  inkscape-roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PatchCreator
        run: python -m pip install -e .
      - name: Install Inkscape and ImageMagick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y inkscape imagemagick
      - name: Render PatchCreator SVG
        run: patchcreator render tests/data/inkscape-roundtrip.yaml -o /tmp/original.svg
      - name: Round-trip through Inkscape
        run: |
          inkscape /tmp/original.svg --export-plain-svg --export-filename=/tmp/roundtrip.svg
          inkscape /tmp/original.svg --export-area-page --export-width=800 --export-filename=/tmp/original.png
          inkscape /tmp/roundtrip.svg --export-area-page --export-width=800 --export-filename=/tmp/roundtrip.png
      - name: Verify visual output is unchanged
        run: |
          set +e
          difference=$(compare -metric AE /tmp/original.png /tmp/roundtrip.png null: 2>&1)
          status=$?
          set -e
          echo "different pixels: $difference"
          test "$status" -eq 0
          test "$difference" = "0"
      - name: Outline curved live text through compatibility export
        run: |
          patchcreator export tests/data/text-outline.svg -o /tmp/text-outline.compat.svg --text paths
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('/tmp/text-outline.compat.svg').getroot()
          local = lambda tag: tag.rsplit('}', 1)[-1]
          assert not [element for element in root.iter() if local(element.tag) == 'text']
          paths = [element for element in root.iter() if local(element.tag) == 'path']
          assert paths, 'outlined export contains no path geometry'
          PY
          inkscape tests/data/text-outline.svg --export-area-page --export-width=800 --export-filename=/tmp/text-live.png
          inkscape /tmp/text-outline.compat.svg --export-area-page --export-width=800 --export-filename=/tmp/text-paths.png
          set +e
          difference=$(compare -metric AE /tmp/text-live.png /tmp/text-paths.png null: 2>&1)
          status=$?
          set -e
          echo "outlined text different pixels: $difference"
          test "$status" -eq 0
          test "$difference" = "0"
