name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: pytest
      - name: CLI smoke test
        run: patchcreator --help


  gui-smoke:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxcb-cursor0
      - name: Install PatchCreator with GUI
        run: python -m pip install -e '.[dev,gui]'
      - name: Headless GUI smoke test
        run: pytest tests/test_gui_qt_smoke.py

  inkscape-roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PatchCreator
        run: python -m pip install -e .
      - name: Install Inkscape and ImageMagick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y inkscape imagemagick
      - name: Render PatchCreator SVG
        run: patchcreator render tests/data/inkscape-roundtrip.yaml -o /tmp/original.svg
      - name: Round-trip through Inkscape
        run: |
          inkscape /tmp/original.svg --export-plain-svg --export-filename=/tmp/roundtrip.svg
          inkscape /tmp/original.svg --export-area-page --export-width=800 --export-filename=/tmp/original.png
          inkscape /tmp/roundtrip.svg --export-area-page --export-width=800 --export-filename=/tmp/roundtrip.png
      - name: Verify visual output is unchanged
        run: |
          set +e
          difference=$(compare -metric AE /tmp/original.png /tmp/roundtrip.png null: 2>&1)
          status=$?
          set -e
          echo "different pixels: $difference"
          test "$status" -eq 0
          test "$difference" = "0"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build source and wheel distributions
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Verify source release materials
        run: |
          sdist_contents=$(tar -tzf dist/*.tar.gz)
          grep -Eq '^[^/]+/CHANGELOG\.md$' <<<"$sdist_contents"
          grep -Eq '^[^/]+/docs/specification\.md$' <<<"$sdist_contents"
          grep -Eq '^[^/]+/examples/minimal-patch\.yaml$' <<<"$sdist_contents"
      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/patchcreator-wheel-smoke
          /tmp/patchcreator-wheel-smoke/bin/python -m pip install dist/*.whl
      - name: Smoke-test installed distribution
        run: |
          smoke_python=/tmp/patchcreator-wheel-smoke/bin/python
          smoke_cli=/tmp/patchcreator-wheel-smoke/bin/patchcreator
          "$smoke_python" - <<'PY'
          from importlib.metadata import version

          import patchcreator

          assert patchcreator.__version__ == version("patchcreator")
          PY
          "$smoke_cli" --version
          "$smoke_cli" profiles list | grep -F brother-innovis-750e
          "$smoke_cli" data list | grep -F natural-earth-land-110m
          "$smoke_cli" render examples/minimal-patch.yaml -o /tmp/minimal-patch.svg
          test -s /tmp/minimal-patch.svg
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
