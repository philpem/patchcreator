[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patchcreator"
version = "0.1.0.dev0"
description = "Procedural, embroidery-aware mission patch SVG composition"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Phil Pemberton"},
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "fonttools>=4.55,<5",
  "pydantic>=2.7,<3",
  "pyshp>=2.3,<3",
  "ruamel.yaml>=0.18,<0.19",
  "shapely>=2.0,<3",
  "uharfbuzz>=0.46,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]
gui = [
  "PySide6>=6.8,<7",
]

[project.urls]
Homepage = "https://github.com/philpem/patchcreator"
Repository = "https://github.com/philpem/patchcreator.git"
Issues = "https://github.com/philpem/patchcreator/issues"

[project.scripts]
patchcreator = "patchcreator.dispatch:main"
patchcreator-gui = "patchcreator.gui.app:main"

[project.entry-points."patchcreator.components"]
# Third-party packages may register component factories/renderers here.

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"patchcreator.profiles" = ["defaults/*.yaml", "defaults/*.yml"]
"patchcreator.data" = ["sources.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
