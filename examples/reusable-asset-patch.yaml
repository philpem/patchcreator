version: 0.1
units: mm

canvas:
  shape: circle
  diameter: 80
  background: space
  safe_margin:
    fixed: 3

profile:
  intent: standard-patch

metadata:
  title: "Reusable Asset and Anchor Example"

palette:
  space: "#05070b"
  border: "#f1c24b"
  body: "#b8bec7"
  outline: "#232831"
  panel: "#2f6fcd"
  accent: "#f28c28"
  accent-light:
    from: accent
    lighten: 0.22

settings:
  default_clip: safe-area
  inkscape_metadata: true
  construction_guides: true
  embroidery_safety: true

layers:
  - id: artwork
    label: Reusable artwork
    elements:
      - id: satellite
        type: asset
        source: assets/demo-satellite.svg
        width: 32
        roles:
          body: body
          outline: outline
          panel: panel
          dish: accent-light
          accent: accent
        position:
          mode: cartesian
          x: 0
          y: -2
          self_anchor: body-centre
        clip:
          target: none
        overlap_policy: warn

      # The marker is positioned relative to an anchor defined inside the SVG
      # asset. If the dish is redrawn, move only the hidden anchor marker in
      # Inkscape and this placement continues to follow it.
      - id: dish-beacon
        type: star
        glyph: four-point
        size: 4
        fill: border
        position:
          mode: relative
          target: satellite
          target_anchor: dish-tip
          self_anchor: centre
          offset: [0, -3]
        clip:
          target: none
        overlap_policy: allow

  - id: text
    label: Text
    elements:
      - id: title
        type: text
        text: "ANCHORS + COLOUR ROLES"
        position:
          mode: cartesian
          x: 0
          y: 0
          self_anchor: origin
        layout:
          type: bottom-arc
          radius: 33
          start_angle: 225deg
          end_angle: 135deg
        font:
          family: "DejaVu Sans"
          size: 4.4
          weight: 700
          tracking: auto
        fill: border
        clip:
          target: none
        overlap_policy: allow

  - id: border-layer
    label: Border
    elements:
      - id: border
        type: border
        inset: 1.2
        stroke:
          colour: border
          width: 1.5
        clip:
          target: none
        overlap_policy: allow
